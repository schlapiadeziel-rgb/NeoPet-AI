plugins { id 'com.android.application' }

android {
    namespace 'ai.neopet.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'ai.neopet.mobile'
        minSdk 26
        targetSdk 36
        versionCode 13
        versionName '0.6.3'
    }

    sourceSets {
        main.assets.srcDirs = ['../../mobile']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
