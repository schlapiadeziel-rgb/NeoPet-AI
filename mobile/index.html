<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#151126" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="NeoPet AI" />
    <title>NeoPet AI Mobile</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">NEOPET AI</p>
          <div class="pet-heading"><span class="online-dot" aria-hidden="true"></span><h1 id="petName">小诺</h1></div>
        </div>
        <div class="top-actions">
          <button id="installButton" class="ghost hidden">安装</button
          ><button id="overlayButton" class="ghost hidden">悬浮</button
          ><button id="settingsButton" class="icon" aria-label="设置">⚙</button>
        </div>
      </header>

      <section
        id="petStage"
        class="pet-stage state-idle"
        data-emotion="neutral"
      >
        <div class="scene-orb orb-one"></div><div class="scene-orb orb-two"></div>
        <div class="companion-summary"><span id="mobileHomeStage">初识</span><span id="mobileHomeMood">平静</span><span id="mobileHomeMemories">0 条记忆</span></div>
        <div id="speechBubble" class="bubble hidden"></div>
        <div
          id="defaultPet"
          class="pet sprite-pet"
          role="button"
          tabindex="0"
          aria-label="触摸桌面宠物小诺"
        ></div>
        <img id="customPet" class="custom-pet hidden" alt="自定义宠物" />
        <model-viewer id="petModel" class="pet-model hidden" camera-controls autoplay interaction-prompt="none" shadow-intensity="0" alt="3D AI 桌宠"></model-viewer>
        <span id="stateLabel" class="state-label">空闲</span>
      </section>

      <section class="quick-actions" aria-label="快捷操作">
        <button id="touchButton"><span aria-hidden="true">♡</span>摸摸</button
        ><button id="waveButton"><span aria-hidden="true">◌</span>挥手</button
        ><button id="micButton"><span aria-hidden="true">◉</span>说话</button>
      </section>

      <section class="care-card"><div class="care-heading"><strong>Lv.<span id="mobileCareLevel">1</span></strong><span><b id="mobileCareCoins">120</b> 金币</span></div><div class="care-meters"><button data-care="feed"><span>饱腹</span><i><b id="mobileCareHunger"></b></i></button><button data-care="rest"><span>精力</span><i><b id="mobileCareEnergy"></b></i></button><button data-care="play"><span>开心</span><i><b id="mobileCareHappiness"></b></i></button><button data-care="bath"><span>清洁</span><i><b id="mobileCareCleanliness"></b></i></button></div></section>

      <section class="chat-card">
        <header class="chat-heading"><div><strong>和 <span id="mobileChatPetName">小诺</span> 聊天</strong><small>会记住重要的事，也会用动作回应你</small></div><span>本地记忆</span></header>
        <div id="messages" class="messages" aria-live="polite">
          <div class="message pet-message">
            你好，我会听、会说，也会根据回答做动作。
          </div>
        </div>
        <form id="chatForm" class="composer">
          <textarea
            id="messageInput"
            rows="1"
            placeholder="和桌宠说点什么……"
          ></textarea
          ><button type="submit">发送</button>
        </form>
      </section>
    </main>

    <dialog id="settingsDialog">
      <form method="dialog" class="settings-card">
        <header>
          <div>
            <p class="eyebrow">CONTROL CENTER</p>
            <h2>宠物设置</h2>
          </div>
          <button class="icon" value="cancel" aria-label="关闭">×</button>
        </header>
        <label>选择宠物</label>
        <div id="petPicker" class="pet-picker" role="radiogroup" aria-label="选择宠物"></div>
        <label>名字<input id="nameInput" maxlength="30" /></label>
        <label>性格<textarea id="personalityInput" rows="3"></textarea></label>
        <label
          >OpenAI 兼容 API 地址<input
            id="baseUrlInput"
            inputmode="url"
            placeholder="https://api.openai.com/v1"
        /></label>
        <label
          >聊天模型<input
            id="modelInput"
            list="modelSuggestions"
            placeholder="自由填写模型名称"
        /></label>
        <datalist id="modelSuggestions">
          <option value="gpt-4.1-mini"></option>
          <option value="qwen2.5:3b"></option>
          <option value="gemma3:4b"></option>
          <option value="llama3.2:3b"></option>
        </datalist>
        <label
          >API 密钥（仅保留到本次浏览器会话）<input
            id="apiKeyInput"
            type="password"
            autocomplete="off"
        /></label>
        <label
          >回复语言<select id="languageInput">
            <option value="auto">自动识别</option>
            <option value="zh-CN">中文</option>
            <option value="en-US">English</option>
            <option value="ja-JP">日本語</option>
            <option value="ko-KR">한국어</option>
          </select></label
        >
        <label
          >导入原创宠物图片<input
            id="avatarInput"
            type="file"
            accept="image/png,image/webp,image/jpeg,image/gif"
        /></label>
        <label>3D 模型网址（GLB/GLTF/VRM）<input id="modelUrlInput" type="url" placeholder="https://example.com/pet.glb" /></label>
        <label>导入本地 3D/VRM 模型<input id="modelFileInput" type="file" accept=".glb,.gltf,.vrm,model/gltf-binary,model/gltf+json" /></label>
        <p class="hint">
          电影和动画只能作为风格灵感，请使用原创或已获授权的角色素材。
        </p>
        <section class="companion-settings">
          <h3>陪伴与记忆</h3>
          <div class="bond-card"><div><strong id="mobileRelationshipStage">初识</strong><span id="mobileRelationshipStats">信任 0 · 连续 0 天</span></div><div class="bond-track"><i id="mobileBondProgress"></i></div></div>
          <label class="toggle-row"><input id="mobileProactiveEnabled" type="checkbox" />允许宠物主动问候</label>
          <h4>记住的事情</h4><div id="mobileMemoryFacts" class="memory-list"><p class="hint">还没有长期记忆</p></div>
          <h4>陪伴日记</h4><div id="mobileCompanionDiary" class="memory-list"><p class="hint">日记会随着相处逐渐出现</p></div>
          <div class="data-actions"><button id="mobileExportButton" type="button" class="secondary">备份</button><label class="secondary import-button">导入<input id="mobileImportInput" type="file" accept="application/json" /></label></div>
          <button id="mobileClearCompanion" type="button" class="secondary danger">清除全部陪伴数据</button>
        </section>
        <section class="companion-settings"><h3>宠物商店</h3><p class="hint">食物 <b id="mobileFoodCount">0</b> · 零食 <b id="mobileSnackCount">0</b> · 清洁 <b id="mobileSoapCount">0</b></p><div class="shop-grid"><button type="button" class="secondary" data-buy="food">食物 ×3<br><small>15 金币</small></button><button type="button" class="secondary" data-buy="snack">零食 ×2<br><small>12 金币</small></button><button type="button" class="secondary" data-buy="soap">清洁 ×2<br><small>10 金币</small></button></div></section>
        <section class="companion-settings"><h3>效率工具</h3><div class="inline-tool"><input id="mobileTodoInput" placeholder="添加待办"><button id="mobileTodoAdd" type="button" class="secondary">添加</button></div><div id="mobileTodoList" class="tool-results"></div><div class="inline-tool"><input id="mobileFocusMinutes" type="number" min="1" max="180" value="25"><button id="mobileFocusButton" type="button" class="secondary">开始专注</button></div><p id="mobileFocusStatus" class="hint">尚未开始</p><div class="inline-tool"><input id="mobileWeatherCity" placeholder="天气城市"><button id="mobileWeatherButton" type="button" class="secondary">查询</button></div><p id="mobileWeatherResult" class="hint"></p></section>
        <button id="saveSettingsButton" class="primary" value="cancel">
          保存
        </button>
        <a class="primary media-link" href="media.html">打开视频中心</a>
        <button id="restorePetButton" class="secondary" value="cancel">
          恢复默认宠物
        </button>
        <p id="settingsStatus" class="status"></p>
      </form>
    </dialog>
    <script src="vendor/model-viewer.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
